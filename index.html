<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>생존 원정 MUD 프로토타입 v0.4.4.3</title>
<style>
:root{
  --bg:#000;
  --fg:#fff;
  --muted:#9a9a9a;
  --line:#fff;
  --red:#ff3b30;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{
  margin:0; min-height:100%; background:#000; color:#fff;
  font-family:"Courier New","Apple SD Gothic Neo",monospace;
  -webkit-user-select:none; user-select:none;
}
body{
  display:flex; justify-content:center;
  padding:12px 10px calc(12px + var(--safe-bottom));
}
#game{
  width:min(100%,460px);
  min-height:calc(100dvh - 24px - var(--safe-bottom));
  display:grid;
  grid-template-rows:auto minmax(230px,1fr) auto 190px auto;
  gap:10px;
}
.box{
  border:3px solid #fff;
  background:#050505;
}
#location{
  padding:11px 14px; text-align:center;
  font-size:18px; font-weight:700; letter-spacing:1px;
}
#stage{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}
#stageContent{
  position:relative;
  width:100%;
  height:100%;
  min-height:205px;
}
.village-art{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;
  white-space:pre;
  font-size:clamp(9px,2.6vw,13px);
  line-height:1.05;
}
.maze-board{
  position:absolute;
  left:50%;
  top:50%;
  width:min(100%,340px);
  height:220px;
  margin:0;
  transform:translate(-50%,-50%);
}
.maze-node{
  position:absolute;
  width:18px; height:18px;
  transform:translate(-50%,-50%);
  border:2px solid #555;
  background:#050505;
  color:#555;
  display:grid;
  place-items:center;
  font-size:9px;
  z-index:3;
}
.maze-node.revealed{border-color:#fff;color:#fff}
.maze-node.current{background:#fff;color:#000;border-color:#fff}
.maze-node.exit{border-style:double;border-width:3px}
.maze-node.hidden-mark{
  border-color:var(--red); color:var(--red); border-style:dashed;
}
.maze-edge{
  position:absolute;
  height:2px;
  background:#333;
  transform-origin:0 50%;
  z-index:1;
}
.maze-edge.revealed{background:#fff}
.maze-edge.backtrack{
  background:#777;
}
.floor-badge{
  position:absolute;
  left:50%;
  top:10px;
  transform:translateX(-50%);
  color:#aaa;
  font-size:12px;
  letter-spacing:1px;
  z-index:10;
  pointer-events:none;
}
#status{
  padding:10px 12px;
  display:grid; grid-template-columns:1fr 1fr;
  gap:6px 12px; font-size:13px;
}
.status-item{
  display:flex; justify-content:space-between; gap:10px;
  border-bottom:1px dotted #555; padding-bottom:3px;
}
.status-item span:last-child{font-weight:700;text-align:right}
#log{
  padding:10px 12px;
  overflow:auto;
  font-size:13px; line-height:1.45; white-space:pre-wrap;
  scrollbar-width:none;
}
#log::-webkit-scrollbar{display:none}
.log-line{margin-bottom:5px}
.log-muted{color:#999}
.log-good{font-weight:700}
.log-alert{color:var(--red);font-weight:900}
#controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
button{
  appearance:none;
  border:3px solid #fff; border-radius:0;
  background:#000; color:#fff;
  min-height:54px;
  font:700 13px "Courier New","Apple SD Gothic Neo",monospace;
  padding:8px 5px;
}
button:active{background:#fff;color:#000}
button:disabled{border-color:#555;color:#555}
button.alert{
  border-color:var(--red);
  color:#fff;
  background:#8b0000;
  font-size:14px;
  animation:pulse .65s steps(2,end) infinite;
}
button.alert:active{background:var(--red);color:#000}
.wide{grid-column:span 2}
.full{grid-column:1/-1}
@keyframes pulse{50%{filter:brightness(1.7)}}

.training-wrap{
  width:min(100%,340px);
  min-height:220px;
  margin:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.novice-sprite{
  white-space:pre;
  text-align:center;
  font-size:13px;
  line-height:1.05;
  color:#fff;
}
.novice-name{
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
}
.training-sub{
  font-size:12px;
  color:#aaa;
  text-align:center;
}
.training-stat-grid{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 12px;
}
.training-stat{
  border-bottom:1px dotted #555;
  display:flex;
  justify-content:space-between;
  padding-bottom:4px;
}
.training-btn{
  min-height:50px;
}
.training-btn small{
  display:block;
  font-size:10px;
  color:#aaa;
  margin-top:2px;
}

.training-nav-row{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
.training-nav-row button{width:100%;min-width:0;}
#toast{
  position:fixed; left:50%;
  bottom:calc(18px + var(--safe-bottom));
  transform:translateX(-50%);
  background:#fff; color:#000;
  padding:8px 12px; display:none; z-index:50;
  font:700 12px "Courier New","Apple SD Gothic Neo",monospace;
  max-width:90vw; text-align:center;
}
#toast.show{display:block}
@media(max-height:720px){
  #game{grid-template-rows:auto minmax(185px,1fr) auto 155px auto}
  #stageContent{min-height:165px}
  .maze-board{height:170px}
  #log{font-size:12px}
  button{min-height:48px}
}
</style>
</head>
<body>
<main id="game">
  <section id="location" class="box">마을 광장 · 휴식 중</section>
  <section id="stage" class="box"><div id="stageContent"></div></section>
  <section id="status" class="box"></section>
  <section id="log" class="box"></section>
  <section id="controls"></section>
</main>
<div id="toast"></div>

<script>
"use strict";

const CONFIG = {
  // 테스트용: 현실 1초 = 게임 1분. 실제 시간으로 시험할 때 false.
  DEMO_MODE:true,

  BASE_DUNGEON_MINUTES:60,
  OFFLINE_MAX_MULTIPLIER:2,
  REST_LIFE_RATE:0.70,

  FLOORS:5,
  MIN_ROOMS_PER_FLOOR:10,
  MAX_ROOMS_PER_FLOOR:15,

  SECOND_BRANCH_CHANCE:0.28,
  BRANCH_SECONDS:5,

  START_LIFE_MINUTES:5*24*60,
  MAX_ACTION:6,

  // 육성 프로토타입
  TRAINING_DAYS:3,
  TRAINING_ACTIONS_PER_DAY:4,
  TRAINING_CARRY_MAX:2,
  // 데모 모드에서는 현실 20초 = 육성 1일
  TRAINING_DEMO_DAY_MS:20000,

  SAVE_KEY:"mud_idle_proto_v11"
};

const TIME_SCALE = CONFIG.DEMO_MODE ? 60 : 1;

const $ = s => document.querySelector(s);
const locationEl=$("#location");
const stageContent=$("#stageContent");
const statusEl=$("#status");
const logEl=$("#log");
const controlsEl=$("#controls");
const toastEl=$("#toast");

let runtime={
  lastFrameAt:Date.now(),
  branchHandle:null
};

function defaultState(){
  return {
    version:4,
    mode:"rest",
    lifeMinutes:CONFIG.START_LIFE_MINUTES,
    action:CONFIG.MAX_ACTION,
    maxAction:CONFIG.MAX_ACTION,
    level:1,
    exp:0,
    gold:0,
    materials:0,
    expeditionCount:0,
    totalHiddenFound:0,
    lastSeenAt:Date.now(),
    screen:"village", // village | training | dungeon
    logs:[
      {text:"> 파티가 마을에서 휴식 중입니다.",cls:"log-muted"},
      {text:"> 원정을 시작할 수 있습니다.",cls:""}
    ],
    expedition:null,

    training:{
      novice:null,
      graduates:[],
      logs:[
        {text:"> 육성소가 비어 있습니다.",cls:"log-muted"},
        {text:"> 새 노비스를 받아 육성을 시작할 수 있습니다.",cls:""}
      ]
    }
  };
}

let state=loadState();

function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function keyXY(x,y){return `${x},${y}`}

function formatMinutes(m){
  m=Math.max(0,Math.floor(m));
  const d=Math.floor(m/1440);
  const h=Math.floor((m%1440)/60);
  const mm=m%60;
  if(d>0)return `${d}일 ${h}시간 ${mm}분`;
  if(h>0)return `${h}시간 ${mm}분`;
  return `${mm}분`;
}
function formatShortMinutes(m){
  m=Math.max(0,Math.floor(m));
  const h=Math.floor(m/60), mm=m%60;
  return h?`${h}h ${mm}m`:`${mm}m`;
}
function gameMinutesFromRealMs(ms){
  return (ms/60000)*TIME_SCALE;
}
function expToNext(level){return 100+(level-1)*40}

function addLog(text,cls=""){
  state.logs.push({text,cls});
  if(state.logs.length>100)state.logs.splice(0,state.logs.length-100);
  renderLog();
}
function showToast(text,ms=1600){
  toastEl.textContent=text;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),ms);
}

/* ---------- 미로 생성 ---------- */

/*
  한 층 = 10~15개의 방으로 된 트리형 미로.
  화면상 상/하/좌/우로 실제 방이 뻗고,
  자동 탐험은 DFS 방식으로 진행한다.
  막다른 길에 도착하면 이전 길로 되돌아간다.
*/
function makeMazeFloor(floorNo, roomCount){
  const W=6, H=4;
  const nodes=[{id:0,x:2,y:1,neighbors:[]}];
  const occupied=new Map([[keyXY(2,1),0]]);
  let safety=0;

  while(nodes.length<roomCount && safety<1000){
    safety++;
    const base=nodes[randInt(0,nodes.length-1)];
    const dirs=[
      {dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}
    ].sort(()=>Math.random()-.5);

    let added=false;
    for(const d of dirs){
      const nx=base.x+d.dx, ny=base.y+d.dy;
      if(nx<0||nx>=W||ny<0||ny>=H)continue;
      const k=keyXY(nx,ny);
      if(occupied.has(k))continue;

      const id=nodes.length;
      nodes.push({id,x:nx,y:ny,neighbors:[base.id]});
      base.neighbors.push(id);
      occupied.set(k,id);
      added=true;
      break;
    }

    if(!added && safety>500){
      // 극히 드물게 공간이 막히면 처음부터 다시 생성
      return makeMazeFloor(floorNo,roomCount);
    }
  }

  // 시작점에서 부모/깊이 계산
  const parent=Array(nodes.length).fill(-1);
  const depth=Array(nodes.length).fill(0);
  const q=[0];
  parent[0]=-2;
  while(q.length){
    const u=q.shift();
    for(const v of nodes[u].neighbors){
      if(parent[v]!==-1)continue;
      parent[v]=u;
      depth[v]=depth[u]+1;
      q.push(v);
    }
  }

  // 가장 멀리 있는 막다른 방을 출구로 사용
  const leaves=nodes.filter(n=>n.id!==0 && n.neighbors.length===1);
  leaves.sort((a,b)=>depth[b.id]-depth[a.id]);
  const exitId=leaves.length?leaves[0].id:nodes.length-1;

  const exitPath=new Set();
  let p=exitId;
  while(p>=0){
    exitPath.add(p);
    if(p===0)break;
    p=parent[p];
  }

  // DFS 이동 액션.
  // 출구가 속한 가지를 항상 마지막에 탐험하여 최종 위치가 출구가 되도록 한다.
  const actions=[];
  function walk(u,par){
    let children=nodes[u].neighbors.filter(v=>v!==par);
    children.sort((a,b)=>{
      const ae=exitPath.has(a)?1:0;
      const be=exitPath.has(b)?1:0;
      if(ae!==be)return ae-be; // 출구 가지를 마지막
      return Math.random()-.5;
    });

    for(const v of children){
      const isExitBranch=exitPath.has(v);
      actions.push({from:u,to:v,backtrack:false});
      walk(v,u);
      if(!isExitBranch){
        actions.push({from:v,to:u,backtrack:true});
      }
    }
  }
  walk(0,-1);

  // 현재 알고 있는 나무에서 출구로 끝나지 않았을 경우 보정
  if(actions.length && actions[actions.length-1].to!==exitId){
    // tree 특성상 거의 발생하지 않지만 안전장치
    let cur=actions.length?actions[actions.length-1].to:0;
    const route=[];
    while(cur!==0){route.push(cur);cur=parent[cur]}
    route.push(0);
  }

  // 숨겨진 갈림길 1개, 가끔 2개
  const branchCount=Math.random()<CONFIG.SECOND_BRANCH_CHANCE?2:1;
  const candidates=nodes
    .filter(n=>n.id!==0 && n.id!==exitId)
    .map(n=>n.id)
    .sort(()=>Math.random()-.5);

  const branches=candidates.slice(0,branchCount).map(nodeId=>({
    nodeId,
    triggered:false,
    taken:false,
    missed:false
  }));

  return {
    floor:floorNo,
    width:W,
    height:H,
    nodes,
    parent,
    exitId,
    actions,
    branches,
    revealedNodes:[0],
    revealedEdges:[],
    currentNode:0,
    finished:false
  };
}

function createDungeon(){
  const floors=[];
  let totalActions=0;

  for(let f=1;f<=CONFIG.FLOORS;f++){
    const floor=makeMazeFloor(
      f,
      randInt(CONFIG.MIN_ROOMS_PER_FLOOR,CONFIG.MAX_ROOMS_PER_FLOOR)
    );
    totalActions+=floor.actions.length;
    floors.push(floor);
  }

  return {
    id:`exp_${Date.now()}`,
    startedAt:Date.now(),
    baseDurationMinutes:CONFIG.BASE_DUNGEON_MINUTES,
    maxLifeCostMinutes:CONFIG.BASE_DUNGEON_MINUTES*CONFIG.OFFLINE_MAX_MULTIPLIER,

    progressMinutes:0,
    lifeCostMinutes:0,

    floors,
    totalActions,
    actionCursor:0,
    currentFloorIndex:0,

    visitedRewardKeys:[],
    expEarned:0,
    goldEarned:0,
    materialsEarned:0,
    hiddenTaken:0,

    pendingBranch:null,
    complete:false
  };
}

function flattenActionAt(exp,index){
  let cursor=index;
  for(let fi=0;fi<exp.floors.length;fi++){
    const floor=exp.floors[fi];
    if(cursor<floor.actions.length){
      return {floorIndex:fi,floor,action:floor.actions[cursor],localActionIndex:cursor};
    }
    cursor-=floor.actions.length;
  }
  return null;
}

function targetActionFromProgress(exp){
  const ratio=clamp(exp.progressMinutes/exp.baseDurationMinutes,0,1);
  return Math.min(exp.totalActions,Math.floor(ratio*exp.totalActions));
}

function edgeKey(a,b){
  return a<b?`${a}-${b}`:`${b}-${a}`;
}

function rewardRoom(exp,floor,nodeId,silent=false){
  const rewardKey=`${floor.floor}:${nodeId}`;
  if(exp.visitedRewardKeys.includes(rewardKey))return;

  exp.visitedRewardKeys.push(rewardKey);

  const expGain=randInt(4,10);
  const matGain=randInt(0,3);
  const goldGain=randInt(0,5);

  exp.expEarned+=expGain;
  exp.materialsEarned+=matGain;
  exp.goldEarned+=goldGain;

  if(!silent){
    const parts=[`EXP +${expGain}`];
    if(matGain)parts.push(`재료 +${matGain}`);
    if(goldGain)parts.push(`재화 +${goldGain}`);
    addLog(`> ${floor.floor}F 방 탐색 완료\n  ${parts.join(" / ")}`);
  }

  const branch=floor.branches.find(b=>b.nodeId===nodeId);
  if(branch && !branch.triggered && !branch.missed){
    startBranchPrompt(floor,branch);
  }
}

function processAction(exp,info,{silent=false,allowPrompt=true}={}){
  const {floorIndex,floor,action}=info;

  if(exp.currentFloorIndex!==floorIndex){
    exp.currentFloorIndex=floorIndex;
    if(!silent)addLog(`> ${floor.floor}F 진입`, "log-good");
  }

  floor.currentNode=action.to;

  if(!floor.revealedNodes.includes(action.to)){
    floor.revealedNodes.push(action.to);
  }
  const ek=edgeKey(action.from,action.to);
  if(!floor.revealedEdges.includes(ek)){
    floor.revealedEdges.push(ek);
  }

  if(action.backtrack){
    if(!silent){
      addLog("> 막다른 길입니다. 왔던 길로 되돌아갑니다.", "log-muted");
    }
  }else{
    rewardRoom(exp,floor,action.to,silent);
    if(!allowPrompt && exp.pendingBranch){
      // 오프라인 진행 중 발견한 숨겨진 길은 선택 기회를 놓친다.
      const found=findPendingBranchObject();
      if(found?.branch)found.branch.missed=true;
      exp.pendingBranch=null;
    }
  }

  // 층의 마지막 액션이면 층 완료
  const last=floor.actions[floor.actions.length-1];
  if(last===action){
    floor.finished=true;
  }
}

function advanceToProgress({silent=false,allowPrompt=true}={}){
  const exp=state.expedition;
  if(!exp)return;

  const target=targetActionFromProgress(exp);

  while(exp.actionCursor<target){
    if(exp.pendingBranch && allowPrompt)break;

    const info=flattenActionAt(exp,exp.actionCursor);
    if(!info)break;

    processAction(exp,info,{silent,allowPrompt});
    exp.actionCursor++;

    if(exp.pendingBranch && allowPrompt)break;
  }

  if(exp.actionCursor>=exp.totalActions && !exp.pendingBranch){
    completeExpedition("online");
  }
}

/* ---------- 숨겨진 길 ---------- */

function startBranchPrompt(floor,branch){
  if(!state.expedition || state.expedition.pendingBranch)return;

  branch.triggered=true;
  state.expedition.pendingBranch={
    floor:floor.floor,
    nodeId:branch.nodeId,
    expiresAt:Date.now()+CONFIG.BRANCH_SECONDS*1000
  };

  addLog(`> ${floor.floor}F에서 숨겨진 통로를 발견했습니다!`,"log-alert");
  startBranchTimer();
  renderControls();
  renderMap();
}

function startBranchTimer(){
  clearInterval(runtime.branchHandle);
  runtime.branchHandle=setInterval(()=>{
    const exp=state.expedition;
    if(!exp?.pendingBranch){
      clearInterval(runtime.branchHandle);
      runtime.branchHandle=null;
      return;
    }

    if(Date.now()>=exp.pendingBranch.expiresAt){
      missBranch();
      return;
    }
    renderControls();
  },100);
}

function findPendingBranchObject(){
  const exp=state.expedition;
  if(!exp?.pendingBranch)return null;
  const floor=exp.floors.find(f=>f.floor===exp.pendingBranch.floor);
  if(!floor)return null;
  const branch=floor.branches.find(b=>b.nodeId===exp.pendingBranch.nodeId);
  return {floor,branch};
}

function takeBranch(){
  const exp=state.expedition;
  if(!exp?.pendingBranch)return;

  const found=findPendingBranchObject();
  if(!found)return;

  found.branch.taken=true;
  exp.hiddenTaken++;
  state.totalHiddenFound++;

  const roll=Math.random();
  if(roll<0.12){
    const bonus=randInt(25,40);
    exp.expEarned+=bonus;
    addLog(`> 숨겨진 방에서 오래된 기록을 발견했습니다.\n  EXP +${bonus}`,"log-good");
  }else if(roll<0.48){
    const gold=randInt(15,30);
    exp.goldEarned+=gold;
    addLog(`> 숨겨진 보관함 발견!\n  재화 +${gold}`,"log-good");
  }else{
    const mat=randInt(5,10);
    const bonus=randInt(8,18);
    exp.materialsEarned+=mat;
    exp.expEarned+=bonus;
    addLog(`> 숨겨진 방 탐색 완료\n  재료 +${mat} / EXP +${bonus}`,"log-good");
  }

  exp.pendingBranch=null;
  clearInterval(runtime.branchHandle);
  runtime.branchHandle=null;
  renderControls();
  renderMap();
  saveState();
}

function missBranch(){
  const exp=state.expedition;
  if(!exp?.pendingBranch)return;

  const found=findPendingBranchObject();
  if(found?.branch)found.branch.missed=true;

  exp.pendingBranch=null;
  clearInterval(runtime.branchHandle);
  runtime.branchHandle=null;

  addLog("> 숨겨진 통로를 지나쳤습니다.","log-muted");
  renderControls();
  renderMap();
  saveState();
}


/* ---------- 육성 ---------- */

function trainingNow(){
  return Date.now();
}

function trainingDayLengthMs(){
  return CONFIG.DEMO_MODE ? CONFIG.TRAINING_DEMO_DAY_MS : 24*60*60*1000;
}

function makeNovice(){
  const names=["루카","미아","노아","에린","카이","레아","테오","유나","엘리","로안"];
  const name=names[randInt(0,names.length-1)];
  return {
    id:`novice_${Date.now()}`,
    name,
    startedAt:trainingNow(),
    lastDayIndex:0,
    day:1,
    baseActions:CONFIG.TRAINING_ACTIONS_PER_DAY,
    actionsLeft:CONFIG.TRAINING_ACTIONS_PER_DAY,
    carry:0,
    stats:{
      STR:randInt(1,3),
      DEX:randInt(1,3),
      INT:randInt(1,3),
      FAI:randInt(1,3)
    },
    tendency:{
      brave:0,
      calm:0
    },
    completed:false,
    className:null
  };
}

function trainingAddLog(text,cls=""){
  state.training.logs.push({text,cls});
  if(state.training.logs.length>60){
    state.training.logs.splice(0,state.training.logs.length-60);
  }
}

function syncTrainingDays(){
  const n=state.training?.novice;
  if(!n || n.completed)return;

  const dayLen=trainingDayLengthMs();
  const elapsed=Math.max(0,trainingNow()-n.startedAt);
  const dayIndex=Math.floor(elapsed/dayLen);
  if(dayIndex<=n.lastDayIndex)return;

  for(let d=n.lastDayIndex+1; d<=dayIndex; d++){
    const unused=Math.max(0,n.actionsLeft);
    const carry=Math.min(CONFIG.TRAINING_CARRY_MAX,unused);
    n.carry=carry;
    n.actionsLeft=CONFIG.TRAINING_ACTIONS_PER_DAY+carry;
    n.day=Math.min(CONFIG.TRAINING_DAYS,d+1);
    trainingAddLog(`> 육성 ${n.day}일차가 시작되었습니다.`, "log-good");
    if(carry>0){
      trainingAddLog(`> 미사용 행동 ${carry}회가 이월되었습니다.`, "log-muted");
    }
  }
  n.lastDayIndex=dayIndex;

  // 3일차에 진입했다고 자동 전직하지 않는다.
  // 마지막 날의 육성 행동을 모두 사용하면 즉시 전직한다.
}

function chooseClass(n){
  const s=n.stats;
  const max=Math.max(s.STR,s.DEX,s.INT,s.FAI);
  const candidates=[];
  if(s.STR===max)candidates.push("나이트");
  if(s.DEX===max)candidates.push("레인저");
  if(s.INT===max)candidates.push("소서러");
  if(s.FAI===max)candidates.push("프리스트");
  return candidates[randInt(0,candidates.length-1)];
}

function finishTraining(){
  const n=state.training?.novice;
  if(!n || n.completed)return;

  n.completed=true;
  n.className=chooseClass(n);

  const graduate={
    id:n.id,
    name:n.name,
    className:n.className,
    level:1,
    exp:0,
    lifeMinutes:CONFIG.START_LIFE_MINUTES,
    stats:{...n.stats}
  };
  state.training.graduates.push(graduate);

  trainingAddLog(`> ${n.name}의 육성이 완료되었습니다.`, "log-good");
  trainingAddLog(`> 전직 결과: ${n.className}`, "log-good");
  trainingAddLog("> 파티 후보 명단에 등록되었습니다.", "log-muted");
}

function beginTraining(){
  if(state.training.novice && !state.training.novice.completed)return;
  state.training.novice=makeNovice();
  state.training.logs=[];
  trainingAddLog(`> 노비스 ${state.training.novice.name}의 육성을 시작합니다.`);
  trainingAddLog(`> ${CONFIG.TRAINING_DAYS}일 동안 능력치를 성장시킵니다.`, "log-muted");
  trainingAddLog(`> 하루 행동 ${CONFIG.TRAINING_ACTIONS_PER_DAY}회 / 최대 ${CONFIG.TRAINING_CARRY_MAX}회 이월`, "log-muted");
  renderAll();
  saveState();
}

function trainStat(stat){
  syncTrainingDays();
  const n=state.training?.novice;
  if(!n || n.completed)return;
  if(n.actionsLeft<=0){
    showToast("오늘 사용할 수 있는 육성 행동이 없습니다.");
    return;
  }

  const gain=randInt(1,2);
  n.stats[stat]+=gain;
  n.actionsLeft--;

  const labels={STR:"근력",DEX:"민첩",INT:"지력",FAI:"신앙"};
  trainingAddLog(`> ${labels[stat]} 훈련 완료\n  ${stat} +${gain}`);

  if(n.day>=CONFIG.TRAINING_DAYS && n.actionsLeft<=0){
    finishTraining();
  }

  renderAll();
  saveState();
}

/* ---------- 원정 / 시간 ---------- */

function startExpedition(){
  if(state.mode==="expedition")return;

  // 최소 1명의 전직 완료 캐릭터가 있어야 원정 가능.
  if(!state.training?.graduates?.length){
    showToast("원정 가능한 캐릭터가 없습니다. 노비스를 육성해 전직시켜 주세요.");
    state.screen="village";
    renderAll();
    return;
  }

  state.screen="dungeon";

  state.mode="expedition";
  state.expedition=createDungeon();
  state.expeditionCount++;
  state.logs=[];

  addLog("> 원정을 시작합니다.");
  addLog("> 파티가 미로를 자동으로 탐색합니다.","log-muted");
  addLog("> 막다른 길에서는 자동으로 되돌아옵니다.","log-muted");
  if(CONFIG.DEMO_MODE){
    addLog("> 데모 모드: 1 현실 초 = 1 게임 분입니다.","log-muted");
  }

  renderAll();
  saveState();
  runtime.lastFrameAt=Date.now();
}

function completeExpedition(source="online",restMinutesAfter=0){
  const exp=state.expedition;
  if(!exp||exp.complete)return;
  exp.complete=true;

  // 미처 진행하지 못한 경우 오프라인 정산용으로 끝까지 처리
  while(exp.actionCursor<exp.totalActions){
    const info=flattenActionAt(exp,exp.actionCursor);
    if(!info)break;
    processAction(exp,info,{silent:true,allowPrompt:false});
    exp.actionCursor++;
  }

  for(const floor of exp.floors){
    for(const branch of floor.branches){
      if(!branch.taken && !branch.missed)branch.missed=true;
    }
  }

  state.gold+=exp.goldEarned;
  state.materials+=exp.materialsEarned;

  const oldLevel=state.level;
  state.exp+=exp.expEarned;
  while(state.exp>=expToNext(state.level)){
    state.exp-=expToNext(state.level);
    state.level++;
  }

  state.mode="rest";
  state.logs=[];

  addLog("> 원정 완료. 파티가 마을로 복귀했습니다.","log-good");
  addLog(`> EXP +${exp.expEarned} / 재화 +${exp.goldEarned} / 재료 +${exp.materialsEarned}`);
  addLog(`> 원정 생명시간 소모: ${formatMinutes(exp.lifeCostMinutes)}`);

  if(restMinutesAfter>0){
    addLog(`> 복귀 후 자동 휴식: ${formatMinutes(restMinutesAfter)}`,"log-muted");
  }
  if(state.level>oldLevel){
    addLog(`> LEVEL UP! Lv.${state.level}`,"log-good");
  }
  addLog("> 자동 휴식 상태로 전환했습니다.","log-muted");

  state.expedition=null;
  clearInterval(runtime.branchHandle);
  runtime.branchHandle=null;

  renderAll();
  saveState();
}

function onlineTick(){
  syncTrainingDays();
  const now=Date.now();
  const realDelta=now-runtime.lastFrameAt;
  runtime.lastFrameAt=now;

  if(realDelta<=0||realDelta>5000)return;

  const gameDelta=gameMinutesFromRealMs(realDelta);

  if(state.mode==="expedition" && state.expedition){
    // 숨겨진 길 선택 중에도 생명시간은 흐르지만 탐험 진행은 잠시 정지.
    state.lifeMinutes-=gameDelta;
    state.expedition.lifeCostMinutes+=gameDelta;

    if(!state.expedition.pendingBranch){
      state.expedition.progressMinutes+=gameDelta;
      advanceToProgress({silent:false,allowPrompt:true});
    }

    if(state.lifeMinutes<=0){
      state.lifeMinutes=0;
      addLog("> 생명시간이 모두 소진되었습니다.","log-alert");
      state.mode="rest";
      state.expedition=null;
    }
  }else{
    state.lifeMinutes-=gameDelta*CONFIG.REST_LIFE_RATE;
    if(state.lifeMinutes<0)state.lifeMinutes=0;
  }

  state.lastSeenAt=now;
  renderLocation();
  renderStatus();
  renderMap();
}

function reconcileOffline(){
  syncTrainingDays();
  const now=Date.now();
  const awayMs=Math.max(0,now-(state.lastSeenAt||now));

  if(awayMs<1000){
    state.lastSeenAt=now;
    runtime.lastFrameAt=now;
    return;
  }

  const awayMin=gameMinutesFromRealMs(awayMs);

  if(state.mode==="expedition" && state.expedition){
    const exp=state.expedition;

    // 기존 5초 선택창이 열린 채 나갔다면 놓친 것으로 처리
    if(exp.pendingBranch){
      const found=findPendingBranchObject();
      if(found?.branch)found.branch.missed=true;
      exp.pendingBranch=null;
    }

    const remainingBase=Math.max(0,exp.baseDurationMinutes-exp.progressMinutes);

    if(awayMin<remainingBase){
      exp.progressMinutes+=awayMin;
      exp.lifeCostMinutes+=awayMin;
      state.lifeMinutes-=awayMin;
      advanceToProgress({silent:true,allowPrompt:false});
      addLog(`> 오프라인 원정 ${formatMinutes(awayMin)} 반영`,"log-muted");
    }else{
      /*
        온라인 기준 완료시각을 넘긴 뒤 재접속:
        실제 경과시간만큼 원정 생명시간을 쓰되,
        총 원정 소모는 온라인 기준 시간의 2배에서 고정.
        그 이후 시간은 마을 자동 휴식.
      */
      const maxRemain=Math.max(0,exp.maxLifeCostMinutes-exp.lifeCostMinutes);
      const expeditionCost=Math.min(awayMin,maxRemain);

      exp.progressMinutes=exp.baseDurationMinutes;
      exp.lifeCostMinutes+=expeditionCost;
      state.lifeMinutes-=expeditionCost;

      const restAway=Math.max(0,awayMin-expeditionCost);
      state.lifeMinutes-=restAway*CONFIG.REST_LIFE_RATE;
      if(state.lifeMinutes<0)state.lifeMinutes=0;

      completeExpedition("offline",restAway);
    }
  }else{
    const cost=awayMin*CONFIG.REST_LIFE_RATE;
    state.lifeMinutes-=cost;
    if(state.lifeMinutes<0)state.lifeMinutes=0;

    if(awayMin>=1){
      addLog(`> 휴식 ${formatMinutes(awayMin)} 반영\n  생명시간 -${formatMinutes(cost)}`,"log-muted");
    }
  }

  state.lastSeenAt=now;
  runtime.lastFrameAt=now;
  saveState();
  renderAll();
}

function renderMap(){
  const map=$("#map");
  const exp=state.expedition;
  if(!map||!exp)return;

  map.innerHTML="";
  const floor=exp.floors[exp.currentFloorIndex];
  if(!floor)return;

  const badge=$("#floorBadge");
  if(badge) badge.textContent=`${floor.floor}F / ${CONFIG.FLOORS}F`;

  const boardW=340, boardH=220;

  // 층 표시는 상단에 독립적으로 띄우고,
  // 미로 도형 자체의 중심은 항상 박스 전체의 정확한 정중앙에 맞춘다.
  const xs=floor.nodes.map(n=>n.x);
  const ys=floor.nodes.map(n=>n.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);

  const rangeX=Math.max(1,maxX-minX);
  const rangeY=Math.max(1,maxY-minY);

  const targetW=250;
  const targetH=135;

  // 실제 미로 bounding box의 중앙을 board 정중앙(170,110)에 맞춤
  const centerX=boardW/2;
  const centerY=boardH/2;

  const coords=floor.nodes.map(n=>({
    x:centerX + (((n.x-minX)/rangeX)-0.5)*targetW,
    y:centerY + (((n.y-minY)/rangeY)-0.5)*targetH
  }));

  // 모든 미로 벽/길을 미리 보여주지 않고, 지나온 길만 밝힌다.
  for(const node of floor.nodes){
    for(const nb of node.neighbors){
      if(nb<node.id)continue;
      const ek=edgeKey(node.id,nb);
      const a=coords[node.id], b=coords[nb];
      const dx=b.x-a.x, dy=b.y-a.y;
      const len=Math.sqrt(dx*dx+dy*dy);
      const angle=Math.atan2(dy,dx)*180/Math.PI;

      const line=document.createElement("div");
      line.className="maze-edge";
      if(floor.revealedEdges.includes(ek))line.classList.add("revealed");
      line.style.left=`${a.x}px`;
      line.style.top=`${a.y}px`;
      line.style.width=`${len}px`;
      line.style.transform=`rotate(${angle}deg)`;
      map.appendChild(line);
    }
  }

  for(const node of floor.nodes){
    const el=document.createElement("div");
    el.className="maze-node";
    el.style.left=`${coords[node.id].x}px`;
    el.style.top=`${coords[node.id].y}px`;

    if(floor.revealedNodes.includes(node.id)){
      el.classList.add("revealed");
      el.textContent="·";
    }else{
      el.textContent="?";
    }

    if(node.id===floor.currentNode){
      el.classList.add("current");
      el.textContent="●";
    }
    if(node.id===floor.exitId){
      el.classList.add("exit");
    }
    map.appendChild(el);
  }

  // 발견된 숨겨진 길만 작은 빨간 ?로 표시
  for(const branch of floor.branches){
    if(!(branch.triggered||branch.taken||branch.missed))continue;
    const base=coords[branch.nodeId];
    const mark=document.createElement("div");
    mark.className="maze-node hidden-mark";
    mark.style.left=`${clamp(base.x+24,20,320)}px`;
    mark.style.top=`${clamp(base.y-24,34,196)}px`;
    mark.textContent=branch.taken?"◆":"?";
    map.appendChild(mark);
  }
}

function showDungeon(){
  if(state.mode!=="expedition" || !state.expedition){
    showToast("진행 중인 원정이 없습니다.");
    return;
  }
  state.screen="dungeon";
  renderAll();
  saveState();
}

function globalHiddenBranchButton(){
  const exp=state.expedition;
  if(!exp?.pendingBranch)return "";
  const remain=Math.max(0,Math.ceil((exp.pendingBranch.expiresAt-Date.now())/1000));
  return `<button id="globalBranchBtn" class="alert full">[!] 원정대가 숨겨진 길 발견 · ${remain}</button>`;
}

function bindGlobalHiddenBranchButton(){
  const btn=$("#globalBranchBtn");
  if(!btn)return;
  btn.onclick=()=>{
    state.screen="dungeon";
    renderAll();
    setTimeout(()=>{
      if(state.expedition?.pendingBranch) takeBranch();
    },0);
  };
}

function renderControls(){
  // 육성 화면: 원정은 백그라운드에서 계속 진행된다.
  if(state.screen==="training"){
    syncTrainingDays();
    const n=state.training.novice;
    const alertBtn=globalHiddenBranchButton();

    if(!n){
      controlsEl.innerHTML=`
        <button id="newNoviceBtn" class="wide">노비스 받기</button>
        <div class="training-nav-row">
          <button id="backVillageBtn">마을 보기</button>
          ${state.mode==="expedition" ? `<button id="viewExpBtn">원정 보기</button>` : `<button disabled>원정 없음</button>`}
        </div>
        ${alertBtn}
      `;
      $("#newNoviceBtn").onclick=beginTraining;
      $("#backVillageBtn").onclick=showVillage;
      if($("#viewExpBtn")) $("#viewExpBtn").onclick=showDungeon;
      bindGlobalHiddenBranchButton();
      return;
    }

    if(n.completed){
      controlsEl.innerHTML=`
        <button id="nextNoviceBtn" class="wide">다음 노비스</button>
        <div class="training-nav-row">
          <button id="backVillageBtn">마을 보기</button>
          ${state.mode==="expedition" ? `<button id="viewExpBtn">원정 보기</button>` : `<button disabled>원정 없음</button>`}
        </div>
        ${alertBtn}
      `;
      $("#nextNoviceBtn").onclick=resetFinishedNovice;
      $("#backVillageBtn").onclick=showVillage;
      if($("#viewExpBtn")) $("#viewExpBtn").onclick=showDungeon;
      bindGlobalHiddenBranchButton();
      return;
    }

    controlsEl.innerHTML=`
      <button class="training-btn" id="trainSTR">근력<small>STR</small></button>
      <button class="training-btn" id="trainDEX">민첩<small>DEX</small></button>
      <button class="training-btn" id="trainINT">지력<small>INT</small></button>
      <button class="training-btn" id="trainFAI">신앙<small>FAI</small></button>
      <div class="training-nav-row">
        <button id="backVillageBtn">마을 보기</button>
        ${state.mode==="expedition" ? `<button id="viewExpBtn">원정 보기</button>` : `<button disabled>원정 없음</button>`}
      </div>
      ${alertBtn}
    `;
    $("#trainSTR").onclick=()=>trainStat("STR");
    $("#trainDEX").onclick=()=>trainStat("DEX");
    $("#trainINT").onclick=()=>trainStat("INT");
    $("#trainFAI").onclick=()=>trainStat("FAI");
    $("#backVillageBtn").onclick=showVillage;
    if($("#viewExpBtn")) $("#viewExpBtn").onclick=showDungeon;
    bindGlobalHiddenBranchButton();
    return;
  }

  // 던전 화면
  if(state.screen==="dungeon" && state.mode==="expedition" && state.expedition){
    const exp=state.expedition;

    if(exp.pendingBranch){
      const remain=Math.max(0,Math.ceil((exp.pendingBranch.expiresAt-Date.now())/1000));
      controlsEl.innerHTML=`
        <button id="branchActionBtn" class="alert full">숨겨진 길 탐색 · ${remain}</button>
        <button id="villageBtn" class="wide">마을 보기</button>
        <button id="trainingBtn" class="wide">육성</button>
      `;
      $("#branchActionBtn").onclick=takeBranch;
      $("#villageBtn").onclick=showVillage;
      $("#trainingBtn").onclick=enterTraining;
      return;
    }

    controlsEl.innerHTML=`
      <button id="villageBtn">마을 보기</button>
      <button id="trainingBtn">육성</button>
      <button id="partyBtn">파티</button>
      <button id="infoBtn">정보</button>
    `;
    $("#villageBtn").onclick=showVillage;
    $("#trainingBtn").onclick=enterTraining;
    $("#partyBtn").onclick=()=>showToast(`파티 후보 ${state.training.graduates.length}명 · 1~4인 편성 예정`);
    $("#infoBtn").onclick=()=>showToast(`원정 진행 ${Math.floor(exp.progressMinutes/exp.baseDurationMinutes*100)}%`);
    return;
  }

  // 마을 화면. 원정 중이라면 원정 보기로 전환한다.
  const alertBtn=globalHiddenBranchButton();
  controlsEl.innerHTML=`
    <button id="trainingBtn">육성</button>
    <button id="expeditionBtn" ${state.mode!=="expedition" && state.training.graduates.length===0 ? "disabled" : ""}>${state.mode==="expedition" ? "원정 보기" : "원정 시작"}</button>
    <button id="partyBtn">파티</button>
    <button id="infoBtn">정보</button>
    ${alertBtn}
  `;
  $("#trainingBtn").onclick=enterTraining;
  $("#expeditionBtn").onclick=state.mode==="expedition" ? showDungeon : startExpedition;
  $("#partyBtn").onclick=()=>showToast(`파티 후보 ${state.training.graduates.length}명 · 1~4인 편성 예정`);
  $("#infoBtn").onclick=()=>{
    const expeditionText=state.mode==="expedition"
      ? `원정대 파견 중 · 백그라운드 진행`
      : `원정대 마을 대기 중`;
    alert(
`프로토타입 v0.4.4

${expeditionText}

• 원정은 1명부터 출발 가능
• 이후 최대 4명까지 파티원을 늘려가는 구조
• 원정 중에도 마을과 육성소 이용 가능
• 마을에서 [원정 보기]로 던전 복귀
• 던전에서 [마을 보기]로 마을 복귀
• 화면을 바꿔도 원정 시간은 계속 진행
• 숨겨진 길 발견 시 마을/육성 화면에도 빨간 알림 표시`
    );
  };
  bindGlobalHiddenBranchButton();
}
/* ---------- 저장 ---------- */

function saveState(){
  state.lastSeenAt=Date.now();
  localStorage.setItem(CONFIG.SAVE_KEY,JSON.stringify(state));
}
function loadState(){
  try{
    const raw=localStorage.getItem(CONFIG.SAVE_KEY);
    if(!raw)return defaultState();
    const parsed=JSON.parse(raw);
    return parsed?.version===4?parsed:defaultState();
  }catch(e){
    return defaultState();
  }
}
function resetGame(){
  localStorage.removeItem(CONFIG.SAVE_KEY);
  state=defaultState();
  runtime.lastFrameAt=Date.now();
  renderAll();
  saveState();
}
window.resetGame=resetGame;

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    saveState();
  }else{
    reconcileOffline();
    if(state.expedition?.pendingBranch)startBranchTimer();
  }
});
window.addEventListener("pagehide",saveState);
window.addEventListener("beforeunload",saveState);

reconcileOffline();
renderAll();
setInterval(onlineTick,250);
setInterval(saveState,2000);
</script>
</body>
</html>
